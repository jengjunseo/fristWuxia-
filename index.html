<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="강호 첫걸음. 한국어 무협 비주얼 노벨 RPG.">
  <meta name="theme-color" content="#101222">
  <title>강호 첫걸음</title>
  <link rel="icon" href="assets/seal.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/GowunBatang-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vn.css?v=2.0.0">
</head>
<body class="booting">
  <div id="worldBackdrop" class="world-backdrop" aria-hidden="true"></div>
  <div class="paper-grain" aria-hidden="true"></div>
  <header class="topbar" inert>
    <a class="brand" href="#" id="brandHome" aria-label="강호 첫걸음 처음으로">
      <span class="brand-stamp">江湖</span>
      <strong>강호 첫걸음</strong>
    </a>
    <div class="top-actions">
      <span class="autosave" id="saveStatus" hidden><i></i> 자동 저장</span>
      <button class="icon-button music-button" id="musicToggle" type="button" aria-label="배경 음악 끄기" aria-pressed="true" title="배경 음악 끄기">♫</button>
      <button class="icon-button" data-panel="glossary" aria-label="강호 수첩 열기" title="강호 수첩"><span data-icon="scroll"></span></button>
      <button class="icon-button" id="menuButton" aria-label="메뉴 열기" title="메뉴"><span data-icon="menu"></span></button>
    </div>
  </header>

  <main id="app" class="app-shell" aria-label="강호 첫걸음 이야기">
    <section class="loading-screen"><div class="seal-loader">江</div><p>이야기를 펼치는 중…</p></section>
  </main>

  <nav class="quick-nav" id="quickNav" aria-label="게임 메뉴" hidden>
    <button data-panel="map"><span data-icon="map"></span>지도</button>
    <button data-panel="inventory"><span data-icon="bag"></span>가방</button>
    <button data-panel="glossary"><span data-icon="scroll"></span>수첩</button>
    <button data-panel="people"><span data-icon="people"></span>인물</button>
    <button data-panel="save"><span data-icon="seal"></span>저장</button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <audio id="mainBgm" src="assets/music/eastern-thought.mp3" preload="none" loop></audio>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="no-script">이 게임은 JavaScript가 필요합니다. 브라우저에서 JavaScript를 허용하고 다시 열어 주세요.</p></noscript>
  <script type="module" src="boot.js?v=2.0.0"></script>
</body>
</html>
